<div class="auth-page">
  <div class="auth-container">

    <div class="auth-left">
      <div class="brand">
        <div class="logo">F</div>
        <span>FixMate</span>
      </div>
      <h1>Welcome back.</h1>
      <p>Log in to track your requests, chat with pros, and get jobs done faster.</p>

      <div class="trust">
        <div class="avatars">
          <span>T</span><span>S</span><span>J</span>
        </div>
        <span>Trusted by 12k+ customers in Joburg</span>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-card">

        <div class="card-header">
          <h2>Log in</h2>
          <p>Enter your details to continue</p>
        </div>

        <form class="form" (ngSubmit)="onLogin()">

          <div class="form-group">
            <label>Email or Phone</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 7l8 6 8-6"/></svg>
              <input type="text" placeholder="you@example.com or 082..." [(ngModel)]="form.email" name="email" required>
            </div>
          </div>

          <div class="form-group">
            <div class="label-row" (click)="navigate('/forgot-password')">
              <label>Password</label>
              <a class="link-sm">Forgot?</a>
            </div>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V8a5 5 0 0 1 10 0v3"/></svg>
              <input [type]="showPassword? 'text' : 'password'" placeholder="Min. 6 characters" [(ngModel)]="form.password" name="password" required>
              <button type="button" class="icon-btn" (click)="togglePassword()">
                <svg *ngIf="!showPassword" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg *ngIf="showPassword" viewBox="0 0 24 24"><path d="M17.9 17.4L6.6 6.1M1 12s4-8 11-8c2.2 0 4.3.7 6.2 1.9M23 12s-4 8-11 8c-2.2 0-4.3-.7-6.2-1.9"/></svg>
              </button>
            </div>
          </div>

          <label class="checkbox">
            <input type="checkbox" [(ngModel)]="rememberMe" name="remember">
            <span class="check"></span>
            <span>Keep me logged in</span>
          </label>

          <button type="submit" class="btn-primary-lg" [disabled]="!canSubmit || isLoading">
            <span *ngIf="!isLoading">Log in</span>
            <span *ngIf="isLoading" class="loader"></span>
          </button>

        </form>

        <p class="bottom-link" (click)="navigate('/register')">Don't have an account? <a>Sign up</a></p>

      </div>

      <p class="safety">Protected by FixMate Secure. Your data is encrypted.</p>
    </div>

  </div>
</div>
